services:
  - type: web
    name: house-of-cards-prompt-engine
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python build_index.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9